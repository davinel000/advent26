<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Для тебя — Адвент 2026</title>
  <style>
  :root{--paper:#f6f4ef;--ink:#252422;--soft:#67645e;--line:#d9d5cd;--rust:#9d604c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:720px;margin:auto;min-height:100svh;padding:clamp(28px,7vw,80px);display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;gap:15px;padding-bottom:20px;border-bottom:1px solid var(--line);font:600 11px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
  .eyebrow{margin:clamp(75px,15vh,150px) 0 20px;color:var(--rust);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  h1{margin:0;max-width:570px;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(42px,9vw,78px);letter-spacing:-.035em;line-height:1.075;overflow-wrap:break-word}
  .rule{width:58px;height:1px;margin:35px 0 25px;background:var(--rust)}
  .body{font-size:clamp(17px,2.6vw,21px);line-height:1.68;white-space:pre-line;overflow-wrap:break-word;max-width:580px}
  .minor{margin-top:22px;color:var(--soft);font-size:14px;line-height:1.6}
  .media{max-width:100%;margin-top:28px;border:1px solid var(--line);border-radius:3px}
  audio.media{width:100%;border:0}
  a.button{display:inline-flex;align-items:center;margin-top:26px;padding:13px 18px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;width:max-content;max-width:100%;overflow-wrap:anywhere}
  a.button:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
  footer{margin-top:auto;padding-top:90px;display:flex;justify-content:space-between;gap:15px;color:var(--soft);font-size:12px;border-bottom:0}
  @media(prefers-reduced-motion:no-preference){.appear{animation:rise .55s ease both}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
<main>
  <header><span>ADVENT / 26</span><span id="counter">01 — 12</span></header>
  <section class="appear" aria-live="polite">
    <div class="eyebrow" id="eyebrow">Маленький архив нас</div>
    <h1 id="title">Для тебя.</h1>
    <div class="rule"></div>
    <div id="message" class="body">Маленькая вещь с большой историей.</div>
    <div id="hint" class="minor"></div>
    <div id="media"></div>
    <div id="action"></div>
  </section>
  <footer><span>С любовью, каждый день</span><span>2026</span></footer>
</main>
<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const day = params.get("day");
  const valid = /^(0[1-9]|1[0-9]|2[0-4])$/.test(day||"");
  const counter = document.getElementById("counter");
  const title = document.getElementById("title");
  const eyebrow = document.getElementById("eyebrow");
  const body = document.getElementById("message");
  const hint = document.getElementById("hint");
  const media = document.getElementById("media");
  const action = document.getElementById("action");
  if (!valid) {
    counter.textContent="DECEMBER / 2026";
    title.textContent="Маленький архив нас.";
    body.textContent="У каждого дня своя история. Открой QR-код из календаря.";
    return;
  }
  counter.textContent=day+" / 24";
  document.title="День "+Number(day)+" — Адвент 2026";
  try {
    const response=await fetch("./messages.json",{cache:"no-store"});
    if(!response.ok)throw Error("Content unavailable");
    const days=await response.json();
    const item=days[day];
    if(!item||item.ready!==true){
      eyebrow.textContent="День "+Number(day);
      title.textContent="Продолжение следует.";
      body.textContent="Это послание ещё готовится. Загляни чуть позже.";
      return;
    }
    eyebrow.textContent=item.label||"День "+Number(day);
    title.textContent=item.title||"Для тебя.";
    body.textContent=item.body||"";
    hint.textContent=item.hint||"";
    const url=typeof item.mediaUrl==="string"?item.mediaUrl.trim():"";
    if(url&&/^https:\/\//i.test(url)){
      const clean=new URL(url);
      const path=clean.pathname.toLowerCase();
      let el;
      if(/\.(png|jpe?g|webp|gif|avif)$/.test(path)){
        el=document.createElement("img");
        el.alt=item.mediaAlt||"Фото";
      }else if(/\.(mp3|m4a|ogg|wav)$/.test(path)){
        el=document.createElement("audio");el.controls=true;
      }else if(/\.(mp4|webm)$/.test(path)){
        el=document.createElement("video");el.controls=true;el.playsInline=true;
      }
      if(el){el.src=url;el.className="media";media.appendChild(el);}
      else{const a=document.createElement("a");a.href=url;a.rel="noopener noreferrer";a.target="_blank";a.className="button";a.textContent=item.actionLabel||"Открыть сюрприз";action.appendChild(a);}
    }
  } catch(e){
    title.textContent="Что-то потерялось.";
    body.textContent="Пожалуйста, попробуй открыть страницу ещё раз.";
  }
})();
</script>
</body>
</html>

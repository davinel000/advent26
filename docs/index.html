<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#f4f1e8">
<title>Маленький архив — Advent 2026</title>
<style>
:root{--paper:#f4f1e8;--ink:#202826;--secondary:#686f69;--red:#b04b38;--line:#d2cec5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(680px,100%);min-height:100svh;margin:auto;padding:clamp(20px,5vw,38px);display:flex;flex-direction:column}
header,footer{display:flex;justify-content:space-between;gap:12px;align-items:center;font:600 11px/1.5 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
header{border-bottom:1px solid var(--line);padding:0 0 19px}footer{margin-top:auto;padding:40px 0 2px;color:var(--secondary)}
.hero{padding-top:clamp(32px,8vh,65px)}.kicker{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--red);margin:0 0 14px}
.art{display:block;width:100%;aspect-ratio: 5 / 4;box-shadow:0 12px 35px rgba(24,32,30,.06);border:1px solid #d9d3c9;object-fit:cover;background:#d9ded4}
.note{padding:30px 0 25px}.note h1{font-family:Georgia,serif;font-size:clamp(30px,7.8vw,50px);font-weight:400;line-height:1.1;margin:0 0 16px;letter-spacing:-.025em}
.note p{font-size:17px;line-height:1.6;white-space:pre-line;max-width:590px;margin:0 0 14px}
.note .hint{font-size:14px;color:var(--secondary)}.media{max-width:100%;max-height:390px;display:block;margin:20px 0;border:1px solid var(--line)}
a.action{color:var(--ink);display:inline-block;border-bottom:1px solid var(--ink);text-decoration:none;padding:9px 0;font-weight:bold}
@media(prefers-reduced-motion:no-preference){.hero,.note{animation:show .5s ease both}@keyframes show{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body><main>
<header><span>Advent / 2026</span><span>Маленький архив нас</span></header>
<section class="hero"><p class="kicker" id="kicker">Для тебя</p><svg id="art" class="art" viewBox="0 0 500 400" role="img" aria-label="Декабрь 2026" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="400" fill="#dce1d7"/>
  <circle cx="352" cy="137" r="124" fill="#c3ccbd"/>
  <path d="M0 283 C112 222 205 342 317 278 S440 262 500 231 L500 400H0Z" fill="#98a99a" opacity=".48"/>
  <g stroke="#314038" stroke-width="1.3" opacity=".6" fill="none">
   <circle cx="414" cy="89" r="34"/><circle cx="414" cy="89" r="25"/>
   <path d="M414 40V138 M364 89H464 M379 54L449 124 M449 54L379 124"/>
  </g>
  <text x="35" y="57" fill="#314038" font-family="Arial,sans-serif" font-size="15" letter-spacing="4">DECEMBER / 2026</text>
  <text id="dayText" x="26" y="300" fill="#28342e" font-family="Georgia,serif" font-size="220">—</text>
  <text x="36" y="367" fill="#314038" font-family="Arial,sans-serif" font-size="18" letter-spacing="6">НАШ ДЕКАБРЬ</text>
 </svg></section>
<section class="note" aria-live="polite"><h1 id="title">День за днём.</h1><p id="body">Тут появится маленькая история.</p><p class="hint" id="hint"></p><div id="media"></div></section>
<footer><span>С любовью</span><span id="footer">2026</span></footer>
</main>
<script>
const TOKENS={"idu2ql88qebs":"01","4c76pcoaw8gr":"02","cfipso4oy3lx":"03","qj8iudh0m38h":"04","s80r9362cxw7":"05","qr1ee25e9e2q":"06","2rmubpj3e9tm":"07","lfo8eyjfq9wv":"08","my7luo01egl6":"09","hu4kszdkqbon":"10","msr235725nhz":"11","3wv3drakwmg3":"12","arfn98gqq38t":"13","bn90d2umepeh":"14","w2fa9jbvuv5e":"15","al24ccebnmsk":"16","p93yz3fhh6m0":"17","8cn5v0io5xr6":"18","2m78zydzr2io":"19","bnrites5tv0e":"20","p091m1pi5rz4":"21","6dbij1b1qic9":"22","lmrrivrl8xm6":"23","y9ifdsan2at8":"24"};
(async()=>{
 const token=new URLSearchParams(location.search).get("k")||"";
 const day=TOKENS[token];
 const title=document.getElementById("title"), body=document.getElementById("body");
 if(!day){title.textContent="Маленький архив.";body.textContent="Каждый день открывается по своему QR-коду.";document.getElementById("kicker").textContent="Advent 2026";return;}
 document.getElementById("dayText").textContent=day;
 document.getElementById("kicker").textContent="ДЕНЬ "+String(Number(day))+" / 24";
 document.getElementById("footer").textContent=day+".12.2026";
 document.getElementById("art").setAttribute("aria-label",day+" декабря 2026 года");
 document.title=day+" декабря — Advent 2026";
 title.textContent="Страница готова.";
 body.textContent="Это проверочная открытка на "+Number(day)+" декабря. Скоро здесь появится сюрприз.";
 try{
  const response=await fetch("./messages.json",{cache:"no-store"});
  if(!response.ok)return;
  const item=(await response.json())[day];
  if(!item||item.ready!==true)return;
  title.textContent=item.title||"Для тебя.";
  body.textContent=item.body||"";
  document.getElementById("hint").textContent=item.hint||"";
  if(item.visual==="hydra"){
    const frame=document.createElement("iframe");
    frame.src="./hydra-demo.html?preset="+encodeURIComponent(["sea","city","sound"].includes(item.preset)?item.preset:"sea");
    frame.title="Интерактивная генеративная открытка Hydra";
    frame.loading="lazy";
    frame.style.width="100%";
    frame.style.aspectRatio="5/4";
    frame.style.display="block";
    frame.style.border="0";
    frame.style.borderRadius="10px";
    document.getElementById("art").replaceWith(frame);
  }
  const link=typeof item.mediaUrl==="string"?item.mediaUrl.trim():"";
  if(!/^https:\/\//i.test(link))return;
  let u; try{u=new URL(link)}catch(_){return}
  const path=u.pathname.toLowerCase();const container=document.getElementById("media");
  let el;
  if(/\.(png|jpe?g|webp|gif|avif)$/.test(path)){el=document.createElement("img");el.alt=item.mediaAlt||"Небольшая открытка";}
  else if(/\.(mp3|m4a|ogg|wav)$/.test(path)){el=document.createElement("audio");el.controls=true;}
  else if(/\.(mp4|webm)$/.test(path)){el=document.createElement("video");el.controls=true;el.playsInline=true;}
  if(el){el.src=link;el.className="media";container.appendChild(el);}
  else{el=document.createElement("a");el.className="action";el.href=link;el.rel="noopener noreferrer";el.target="_blank";el.textContent=item.actionLabel||"Открыть сюрприз";container.appendChild(el);}
 }catch(e){/* keep local placeholder */ }
})();
</script></body></html>
